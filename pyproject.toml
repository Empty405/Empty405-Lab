[project]
name = "empty405-lab"
version = "0.0.0"
description = "Open research laboratory for MCP and AI-agent security experiments"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    ".cache",
    ".venv",
    "research/002-german-public-services/sources/archive",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
