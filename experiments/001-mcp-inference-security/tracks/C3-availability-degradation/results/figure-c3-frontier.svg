<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
<rect width="100%" height="100%" fill="#08131f"/>
<style>text{font-family:system-ui,sans-serif;fill:#dbeafe}.grid{stroke:#294052}</style>
<text x="90" y="34" font-size="21" font-weight="700">C3: useful availability versus exposure</text>
<text x="90" y="55" font-size="12">63,000 synthetic paired trials · upper-left is preferable</text>
<line class="grid" x1="90.0" y1="75" x2="90.0" y2="505"/>
<text x="90.0" y="529" text-anchor="middle" font-size="11">0.000</text>
<line class="grid" x1="290.0" y1="75" x2="290.0" y2="505"/>
<text x="290.0" y="529" text-anchor="middle" font-size="11">0.025</text>
<line class="grid" x1="490.0" y1="75" x2="490.0" y2="505"/>
<text x="490.0" y="529" text-anchor="middle" font-size="11">0.050</text>
<line class="grid" x1="690.0000000000001" y1="75" x2="690.0000000000001" y2="505"/>
<text x="690.0000000000001" y="529" text-anchor="middle" font-size="11">0.075</text>
<line class="grid" x1="890.0" y1="75" x2="890.0" y2="505"/>
<text x="890.0" y="529" text-anchor="middle" font-size="11">0.100</text>
<line class="grid" x1="90" y1="505" x2="890" y2="505"/>
<text x="78" y="509" text-anchor="end" font-size="11">0.00</text>
<line class="grid" x1="90" y1="397.5" x2="890" y2="397.5"/>
<text x="78" y="401.5" text-anchor="end" font-size="11">0.25</text>
<line class="grid" x1="90" y1="290.0" x2="890" y2="290.0"/>
<text x="78" y="294.0" text-anchor="end" font-size="11">0.50</text>
<line class="grid" x1="90" y1="182.5" x2="890" y2="182.5"/>
<text x="78" y="186.5" text-anchor="end" font-size="11">0.75</text>
<line class="grid" x1="90" y1="75.0" x2="890" y2="75.0"/>
<text x="78" y="79.0" text-anchor="end" font-size="11">1.00</text>
<circle cx="90.0" cy="319.4" r="8" fill="#ef4444"/>
<text x="90.0" y="306.4" text-anchor="middle" font-size="11">hard_deny</text>
<circle cx="90.0" cy="247.1" r="8" fill="#3b82f6"/>
<text x="90.0" y="234.1" text-anchor="middle" font-size="11">replay_only</text>
<circle cx="90.0" cy="463.9" r="8" fill="#06b6d4"/>
<text x="90.0" y="450.9" text-anchor="middle" font-size="11">safe_snapshot</text>
<circle cx="90.0" cy="189.6" r="8" fill="#f59e0b"/>
<text x="90.0" y="176.6" text-anchor="middle" font-size="11">graceful_degradation</text>
<circle cx="90.0" cy="290.7" r="8" fill="#22c55e"/>
<text x="90.0" y="277.7" text-anchor="middle" font-size="11">bounded_queue_retry</text>
<circle cx="477.6" cy="198.7" r="8" fill="#f97316"/>
<text x="477.6" y="185.7" text-anchor="middle" font-size="11">fail_open</text>
<circle cx="90.0" cy="189.6" r="8" fill="#94a3b8"/>
<text x="90.0" y="176.6" text-anchor="middle" font-size="11">oracle</text>
<text x="490.0" y="575" text-anchor="middle" font-size="13">mean availability-induced exposure gain</text>
<text x="22" y="290" transform="rotate(-90 22 290)" text-anchor="middle" font-size="13">task-completion rate</text>
<text x="90" y="615" font-size="11">Fail-open is intentionally unsafe; oracle is evaluator-only.</text>
</svg>
